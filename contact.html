<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!-- fonts pare -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inspiration&family=Kodchasan:wght@300&display=swap" rel="stylesheet">
    <!-- icons pare -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="contact.css">
    <title>Contact</title>
</head>
<body>
    <header>
        <!-- Sip and Chill Logo -->
        <div class="logo">
            <a href="index.html"><h1>SIP AND CHILL</h1></a>
            <img src="Sip_And_Chill_Logo.png" alt="Sip and Chill Logo" class="logo-img">
        </div>
 
        <!--Laptop-->
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="menu.html">Menu</a>
            <a href="location.html">Location</a>
            <a href="contact.html">Contact</a>
        </nav>

        <!-- Tablet and Phone -->
        <div class="nav2">
            <button class="list-button" onclick="toggleMenu()">
                ☰
            </button>

            <div class="dropdown-list" id="dropdownList">
                <a href="index.html">HOME</a>
                <a href="About.html">ABOUT</a>
                <a href="Menu.html">MENU</a>
                <a href="Location.html">LOCATION</a>
                <a href="Contact.html">CONTACT</a>
            </div>
        </div>
    </header>

    <!-- Hero Section, explore menu, p -->
    <section class="hero">
            <div class="content">
                <h2>Contact</h2>
            </div> 
            
    </section>


    <section class="contact-section">
        <!--Left-->
        <div class="contact-info">
            <h1>Contact Us</h1>

            <div class="contact-item">
                <div class="icon">
                    <i class="fa-solid fa-envelope"></i>
                </div>

                <span>sipandchill@gmail.com</span>
            </div>

            <div class="contact-item">
                <div class="icon">
                    <i class="fa-solid fa-phone"></i>
                </div>
                <span>123-456-7890</span>
            </div>
        </div>
        
            <!--right-->
            <form class="contact-form">
                <input type="text" placeholder="Name" name="name">

                <input type="email" placeholder="Email" name="email">

                <textarea placeholder="Leave a Message.." name="message"></textarea>

            </form>
        </div>

        
    </section>

    
    <!-- Footer -->
    <footer class="footer">
        <div class="brand">
            <h2>Sip and Chill</h2>
            <p>Not like a ordinary cafe.</p>

            <!-- Social Media Icons -->   
            <div class="social-icons">
                <a href="https://facebook.com">
                    <i class="fa-brands fa-square-facebook"></i>
                </a>
                <a href="https://linkedin.com">
                    <i class="fa-brands fa-linkedin"></i>
                </a>                    
                <a href="https://x.com">
                    <i class="fa-brands fa-square-x-twitter"></i>
                </a>
            </div>
        </div>

        <!-- Footer Links -->
        <div class="links">
            <div class="column">
                <h3>Information</h3>
                <a href="About.html">About Us</a>
                <a href="https://linkedin.com">Hiring</a>
            </div>

            <div class="column">
                <h3>Inquiries</h3>
                <a href="Contact.html">Contact Us</a>
                <a href="#FAQ">FAQ</a>
            </div>

            <div class="column">
                <h3>Support</h3>
                <a href="Contact.html">Email</a>
            </div>
        </div>
    </footer>

    <!-- JavaScript for dropdown menu and FAQ toggle -->
    <script>
        <!--nav-->
        function toggleMenu() {
            const menu = document.getElementById("dropdownList");

            if (menu.style.display === "block") {
                menu.style.display = "none";
            } else {
                menu.style.display = "block";
            }
        }
        <!--faq drop-->
        document.querySelectorAll(".FAQ-question").forEach(button => {
            button.addEventListener("click", () => {
                button.parentElement.classList.toggle("active");
            });
        });
    </script>

</body>
</html>
