<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!-- fonts pare -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inspiration&family=Kodchasan:wght@300&display=swap" rel="stylesheet">
    <!-- icons pare -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="location.css">
    <title>Location</title>
</head>
<body>
    <header>
        <!-- Sip and Chill Logo -->
        <div class="logo">
            <a href="index.html"><h1>SIP AND CHILL</h1></a>
            <img src="Sip_And_Chill_Logo.png" alt="Sip and Chill Logo" class="logo-img">
        </div>
 
        <!--Laptop-->
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="menu.html">Menu</a>
            <a href="location.html" class="current">Location</a>
            <a href="contact.html">Contact</a>
        </nav>

        <!-- Tablet and Phone -->
        <div class="nav2">
            <button class="list-button" onclick="toggleMenu()">
                ☰
            </button>

            <div class="dropdown-list" id="dropdownList">
                <a href="index.html">HOME</a>
                <a href="about.html">ABOUT</a>
                <a href="menu.html">MENU</a>
                <a href="location.html" class="current">LOCATION</a>
                <a href="contact.html">CONTACT</a>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
            <div class="content">
                <h2>Location</h2>
            </div> 
            
    </section>


    <!--Location-->
    <section class="location">

        <!--Left-->
        <div class="location-info">

            <h1 class="title">SIP AND CHILL</h1>
            
            <p class="address">The location<br>
            1234 Graden Boulevard<br>
            City, Z 98765</p>

            <a href="https://www.google.com/maps" class="map-button">Head to Maps<span class="arrow">→</span></a>

        </div>

        <!--right-->
        <div class="map">
            <img src="pin.png" alt="Location" class="pin">
        </div>

    </section>


    
    <!-- Footer -->
    <footer class="footer">
        <div class="brand">
            <h2>Sip and Chill</h2>
            <p>Not like an ordinary cafe.</p>

            <!-- Social Media Icons -->   
            <div class="social-icons">
                <a href="https://facebook.com">
                    <i class="fa-brands fa-square-facebook"></i>
                </a>
                <a href="https://linkedin.com">
                    <i class="fa-brands fa-linkedin"></i>
                </a>                    
                <a href="https://x.com">
                    <i class="fa-brands fa-square-x-twitter"></i>
                </a>
            </div>
        </div>

        <!-- Footer Links -->
        <div class="links">
            <div class="column">
                <h3>Information</h3>
                <a href="about.html">About Us</a>
                <a href="https://linkedin.com">Hiring</a>
            </div>

            <div class="column">
                <h3>Inquiries</h3>
                <a href="contact.html">Contact Us</a>
                <a href="index.html#FAQ">FAQ</a>
            </div>

            <div class="column">
                <h3>Support</h3>
                <a href="contact.html">Email</a>
            </div>
        </div>
    </footer>

    <!-- JavaScript for dropdown menu and FAQ toggle -->
    <script>
        <!--nav-->
        function toggleMenu() {
            const menu = document.getElementById("dropdownList");

            if (menu.style.display === "block") {
                menu.style.display = "none";
            } else {
                menu.style.display = "block";
            }
        }
        <!--faq drop-->
        document.querySelectorAll(".FAQ-question").forEach(button => {
            button.addEventListener("click", () => {
                button.parentElement.classList.toggle("active");
            });
        });
    </script>

</body>
</html>
